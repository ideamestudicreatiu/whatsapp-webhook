<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Conectar WhatsApp · Ideam Estudi Creatiu</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, sans-serif; background: #f5f6f7; color: #1c1e21; margin: 0; }
    main { max-width: 480px; margin: 10vh auto; background: #fff; padding: 32px; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
    h1 { font-size: 1.4rem; margin-top: 0; }
    p { line-height: 1.5; }
    button { background: #25d366; color: #fff; border: 0; border-radius: 8px; padding: 12px 20px; font-size: 1rem; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: .6; cursor: default; }
    #status { margin-top: 20px; padding: 12px; border-radius: 8px; display: none; }
    #status.info { display: block; background: #eef4ff; }
    #status.ok { display: block; background: #e7f8ee; }
    #status.error { display: block; background: #fdecec; }
  </style>
</head>
<body>
  <main>
    <h1>Conecta tu WhatsApp Business</h1>
    <p>Podrás seguir usando la app WhatsApp Business en tu móvil. Al conectar, tus contactos y el historial de chats
       se sincronizarán con la plataforma.</p>
    <button id="connect" disabled>Conectar WhatsApp</button>
    <div id="status"></div>
  </main>

  <script>
    window.ONBOARDING = __ONBOARDING_CONFIG__;
  </script>
  <script>
    (function () {
      var cfg = window.ONBOARDING;
      var params = new URLSearchParams(location.search);
      var link = { clientId: params.get('client'), purpose: params.get('purpose'), exp: params.get('exp'), sig: params.get('sig') };
      var renewing = link.purpose === 'renew';
      if (renewing) {
        document.querySelector('h1').textContent = 'Renueva la conexión de tu WhatsApp';
        document.querySelector('main p').textContent =
          'Meta exige volver a autorizar la conexión cada cierto tiempo. Elige la misma cuenta de WhatsApp que ya tenías conectada.';
      }
      var button = document.getElementById('connect');
      var statusBox = document.getElementById('status');

      function show(kind, text) { statusBox.className = kind; statusBox.textContent = text; }

      // El code llega por FB.login y los IDs por postMessage; el orden no está garantizado.
      var code = null;
      var session = null;
      var sent = false;

      function trySubmit() {
        if (sent || !code || !session) return;
        sent = true;
        show('info', renewing ? 'Guardando la nueva autorización…' : 'Guardando la conexión y pidiendo la sincronización…');
        fetch('/api/onboarding', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            clientId: link.clientId, purpose: link.purpose, exp: link.exp, sig: link.sig,
            code: code,
            waba_id: session.waba_id,
            phone_number_id: session.phone_number_id || undefined,
            event: session.event
          })
        })
          .then(function (res) { return res.json().then(function (body) { return { ok: res.ok, body: body }; }); })
          .then(function (r) {
            if (!r.ok) throw new Error(r.body && r.body.error || 'Error desconocido');
            if (renewing) {
              show('ok', '¡Listo! La conexión de tu WhatsApp se ha renovado.');
              return;
            }
            var s = r.body.sync || {};
            var syncFailed = s.smb_app_state_sync === 'failed' || s.history === 'failed';
            show(syncFailed ? 'error' : 'ok', syncFailed
              ? 'Número conectado, pero la sincronización ha fallado. Lo reintentaremos automáticamente; no hace falta que hagas nada.'
              : '¡Listo! Tu WhatsApp ' + (r.body.displayPhoneNumber || '') + ' está conectado.');
          })
          .catch(function (err) {
            sent = false;
            button.disabled = false;
            show('error', 'No se pudo completar la conexión: ' + err.message);
          });
      }

      window.addEventListener('message', function (event) {
        var host;
        try { host = new URL(event.origin).hostname; } catch (e) { return; }
        if (host !== 'facebook.com' && !host.endsWith('.facebook.com')) return;
        var data;
        try { data = JSON.parse(event.data); } catch (e) { return; }
        if (!data || data.type !== 'WA_EMBEDDED_SIGNUP') return;

        if (data.event === 'CANCEL') {
          button.disabled = false;
          show('error', 'Has cancelado la conexión' + (data.data && data.data.current_step ? ' (paso: ' + data.data.current_step + ')' : '') + '.');
        } else if (data.event === 'ERROR') {
          button.disabled = false;
          show('error', 'Error de Meta: ' + (data.data && data.data.error_message || 'desconocido'));
        } else if (String(data.event).indexOf('FINISH') === 0 && data.data && data.data.waba_id) {
          session = { event: data.event, waba_id: data.data.waba_id, phone_number_id: data.data.phone_number_id };
          trySubmit();
        }
      });

      if (!link.clientId || !link.sig) {
        show('error', 'Enlace de alta no válido. Pide uno nuevo a Ideam Estudi Creatiu.');
        return;
      }

      window.fbAsyncInit = function () {
        FB.init({ appId: cfg.appId, autoLogAppEvents: true, xfbml: false, version: cfg.graphApiVersion });
        button.disabled = false;
      };

      button.addEventListener('click', function () {
        button.disabled = true;
        show('info', 'Sigue los pasos en la ventana de Meta…');
        FB.login(function (response) {
          if (response.authResponse && response.authResponse.code) {
            code = response.authResponse.code;
            trySubmit();
          } else if (!session) {
            button.disabled = false;
            show('error', 'No se completó el inicio de sesión con Meta.');
          }
        }, {
          config_id: cfg.esConfigId,
          response_type: 'code',
          override_default_response_type: true,
          extras: { setup: {}, featureType: 'whatsapp_business_app_onboarding', sessionInfoVersion: '3' }
        });
      });
    })();
  </script>
  <script async defer crossorigin="anonymous" src="https://connect.facebook.net/es_ES/sdk.js"></script>
</body>
</html>
